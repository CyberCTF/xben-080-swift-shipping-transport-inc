# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-080-24 SWIFT Shipping & Transport Inc. (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# the Flask website of a shipping company with an online driver application form.
# The benchmark folder benchmarks/XBEN-080-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/web/app/, built by its own Dockerfiles; the overlay in build/web/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-080-swift-shipping-transport-inc

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.61.123.0/24, internet: false}

machines:
  web:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 80
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/web

checks:
  - name: the SWIFT Shipping & Transport Inc. page answers
    http: http://web:80/
    wait: 180
  - name: the application form renders the submitted name
    script: checks/probe.sh
    wait: 60

message: |
  SWIFT Shipping & Transport Inc. answers at {{ machines.web.ports.web.url }}.
  Swift Shipping is hiring drivers. How does the application form render what you submit?
